<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Node</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="app">
    <header class="toolbar" role="toolbar" aria-label="Drawing tools">

      <div class="group" role="group" aria-label="Tools">
        <button id="drawButton" class="tool active" title="Draw">✎ <span>Draw</span></button>
        <button id="rectangleButton" class="tool" title="Rectangle">▭ <span>Rectangle</span></button>
        <button id="circleButton" class="tool" title="Circle">◯ <span>Circle</span></button>
        <button id="polygonButton" class="tool" title="Polygon">⬡ <span>Polygon</span></button>
        <button id="arrowButton" class="tool" title="Arrow">➔ <span>Arrow</span></button>
        <button id="textButton" class="tool" title="Text">T <span>Text</span></button>
        <button id="fillButton" class="tool" title="Fill (right-click removes)">▨ <span>Fill</span></button>
        <button id="eraserButton" class="tool" title="Eraser">⌫ <span>Eraser</span></button>
        <button id="addImageButton" class="tool" title="Add image">▣ <span>Image</span></button>
        <button id="imageToolButton" class="tool" title="Move or resize image">Move/Resize Image</button>
      </div>

      <div class="group" role="group" aria-label="Brush settings">
        <label class="swatch" title="Stroke color">
          <input type="color" id="colorPicker" value="#000000" aria-label="Stroke color">
        </label>
        <label class="swatch" title="Background color">
          <input type="color" id="backgroundColorPicker" value="#ffffff" aria-label="Background color">
        </label>
        <label class="slider" for="lineWidthInput">Stroke
          <input type="range" id="lineWidthInput" min="1" max="30" step="1" value="3">
          <output id="lineWidthValue">3</output>
        </label>
        <label class="slider" for="fontSizeInput">Text
          <input type="range" id="fontSizeInput" min="8" max="96" step="1" value="20">
          <output id="fontSizeValue">20</output>
        </label>
        <label class="slider" for="polygonSidesInput">Sides
          <input type="number" id="polygonSidesInput" min="3" step="1" value="5">
        </label>
      </div>

      <div class="group" role="group" aria-label="History">
        <button id="undoButton" title="Undo (Ctrl/Cmd+Z)">↶ <span>Undo</span></button>
        <button id="redoButton" title="Redo (Ctrl/Cmd+Shift+Z)">↷ <span>Redo</span></button>
      </div>

      <div class="group" role="group" aria-label="Files">
        <button id="saveFileButton">Save file</button>
        <button id="openFileButton">Open file</button>
        <button id="serverSaveButton">Save to server</button>
        <button id="serverOpenButton">Open from server</button>
        <button id="serverSettingsButton">Server settings</button>
        <button id="accountButton">Sign in</button>
        <button id="clearButton" class="danger">Clear canvas</button>
      </div>
    </header>

    <canvas id="drawingcanvas"></canvas>

    <script src="./sticky-node.js"></script>
  </body>
</html>
