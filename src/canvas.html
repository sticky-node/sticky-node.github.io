<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Node</title>
  </head>
  <body>
    <input type="color" id="colorPicker" value="#000000">
    <button id="eraserButton">Eraser: Off</button>
    <button id="clearButton">Clear Canvas</button>
    <button id="drawButton">Draw</button>
    <button id="rectangleButton">Rectangle</button>
    <button id="textButton">Text</button>
    <button id="circleButton">Circle</button>
    <button id="arrowButton">Arrow</button>
    <label for="polygonSidesInput">Polygon sides</label>
    <input type="number" id="polygonSidesInput" min="3" step="1" value="5">
    <button id="polygonButton">Polygon</button>
    <button id="undoButton">Undo</button>
    <button id="redoButton">Redo</button>

    <canvas id="drawingcanvas"></canvas>

    <script type="module" src="./main.js"></script>
  </body>
</html>
