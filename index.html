<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    canvas {
      display: block;
      background: white;
    }
  </style>
</head>
<body>
  <input type="color" id="colorPicker" value="#000000">
  <button id="eraserButton">Eraser: Off</button>
  <button id="clearButton">Clear Canvas</button>

  <canvas id="drawingcanvas"></canvas>

  <script>
    const canvas = document.getElementById("drawingcanvas");
    const context = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const clearButton = document.getElementById("clearButton");

    clearButton.addEventListener("click", () => {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.globalCompositeOperation = "source-over";
      localStorage.removeItem(storageKey);
    });

    const storageKey = "drawingCanvas";

    function saveCanvas() {
      localStorage.setItem(storageKey, canvas.toDataURL("image/png"));
    }

    function loadCanvas() {
      const savedDrawing = localStorage.getItem(storageKey);
      if (!savedDrawing) return;

      const image = new Image();
      image.onload = () => {
        context.drawImage(image, 0, 0);
      };
      image.src = savedDrawing;
    }

    loadCanvas();

    const colorPicker = document.getElementById("colorPicker");
    let selectedColor = "#000000";

    colorPicker.addEventListener("input", () => {
      selectedColor = colorPicker.value;
    });

    function getMousePosition(event) {
      const rectangle = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rectangle.left,
        y: event.clientY - rectangle.top
      }
    }

    const eraserButton = document.getElementById("eraserButton");
    let erasing = false;

    eraserButton.addEventListener("click", () => {
      erasing = !erasing;
      eraserButton.textContent = erasing ? "Eraser: On" : "Eraser: Off";
    });

    let drawing = false;

    canvas.addEventListener("mousedown", (event) => {
      drawing = true;

      const position = getMousePosition(event);

      context.beginPath();
      context.moveTo(position.x, position.y);
    });

    canvas.addEventListener("mousemove", (event) => {
      if (!drawing) return;

      const position = getMousePosition(event);

      context.lineTo(position.x, position.y);
      context.globalCompositeOperation = erasing
        ? "destination-out"
        : "source-over";
        context.strokeStyle = selectedColor;
        context.lineWidth = erasing ? 25 : 3;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.stroke();
    });

    canvas.addEventListener("mouseup", () => {
      drawing = false;
      saveCanvas();
    });

    canvas.addEventListener("mouseleave", () => {
      if (drawing) saveCanvas();
      drawing = false;
    });
  </script>
</body>
</html>
